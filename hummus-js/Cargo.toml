[package]
name = "hummus-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
hummus-request={path="../request/"}
paste = "1.0"
wasm-bindgen = { version = "0.2.100" }
wasm-bindgen-futures = "0.4.42"
serde = { version = "1.0.219", features = ["derive"] ,default-features=false}
hummus-macros={path="../macros/"}

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
]

[features]
tauri=["hummus-request/tauri"]

[lib]
crate-type = ["cdylib"]
